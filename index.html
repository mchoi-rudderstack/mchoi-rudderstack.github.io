    <!-- OneTrust Cookie Consent Notice -->
    <script type="text/javascript" src="https://cdn.cookielaw.org/consent/7c9b4dc8-bb26-4b56-b89b-e5fac96e61a6/OtAutoBlock.js"></script>
    <script src="https://cdn.cookielaw.org/scripttemplates/otSDKStub.js" type="text/javascript" charset="UTF-8" data-domain-script="7c9b4dc8-bb26-4b56-b89b-e5fac96e61a6"></script>

    <script>
      // Track OptanonWrapper and SDK state
      let optanonWrapperCallCount = 0;
      let rudderSdkLoaded = false;
      let rudderReadyProcessed = false;

      function OptanonWrapper() {
        optanonWrapperCallCount++;
        console.log(`OptanonWrapper called (${optanonWrapperCallCount} times)`);

        // Define consent groups
        const consentGroups = {
          targeting: "C0004",
          // performance: "C0002",
          functional: "C0003",
          social_media: "C0005",
          analytics: "C0007",
          necessary: "C0001"
        };

        // Check active consent categories
        const isCategoryActive = (catId) => {
          return typeof OptanonActiveGroups !== "undefined" && OptanonActiveGroups.indexOf(catId) > -1;
        };

        const userConsent = {
          targeting: isCategoryActive(consentGroups.targeting),
          functional: isCategoryActive(consentGroups.functional),
          social_media: isCategoryActive(consentGroups.social_media),
          analytics: isCategoryActive(consentGroups.analytics),
          necessary: isCategoryActive(consentGroups.necessary)
        };

        console.log("OptanonWrapper: User Consent", userConsent);
        console.log("OptanonWrapper: Consent Banner Closed", window.OneTrust ? window.OneTrust.IsAlertBoxClosed() : "OneTrust not loaded");
        console.log("OptanonWrapper: Analytics Consent (C0007)", userConsent.analytics);

        // Load RudderStack SDK only after consent banner is closed
        if (window.OneTrust && window.OneTrust.IsAlertBoxClosed() && !rudderSdkLoaded) {
          console.log("OptanonWrapper: Initializing RudderStack SDK after consent");
          try {
            rudderanalytics.load('2OvV4mlg8kveN6sdbImEy5hRnyG', 'https://rudderstacodk.dataplane.rudderstack.com', {
              consentManagement: {
                enabled: true,
                provider: "oneTrust"
              }
            });
            rudderSdkLoaded = true;
            console.log("OptanonWrapper: RudderStack SDK load called successfully");
          } catch (error) {
            console.error("OptanonWrapper: Error loading RudderStack SDK", error);
          }

          // Register ready callback
          try {
            rudderanalytics.ready(() => {
              if (!rudderReadyProcessed) {
                console.log("RudderStack SDK is ready");
                console.log("RudderStack queue before processing", window.rudderanalytics);
                try {
                  rudderanalytics.consent({
                    consent: userConsent
                  });
                  rudderanalytics.track("View Main Page");
                } catch (error) {
                  console.error("RudderStack ready: Error sending initial events", error);
                }
                rudderReadyProcessed = true;
              } else {
                console.log("RudderStack ready logic already processed, skipping");
              }
            });
          } catch (error) {
            console.error("OptanonWrapper: Error registering ready callback", error);
          }
        } else if (!window.OneTrust) {
          console.warn("OptanonWrapper: OneTrust not loaded, cannot check consent status");
        } else if (!window.OneTrust.IsAlertBoxClosed()) {
          console.log("OptanonWrapper: Consent banner still open, delaying SDK load");
        } else {
          console.log("OptanonWrapper: RudderStack SDK already loaded, skipping load");
        }

        // Listen for consent changes
        if (window.OneTrust && window.OneTrust.OnConsentChanged && rudderSdkLoaded) {
          window.OneTrust.OnConsentChanged(() => {
            console.log("OneTrust consent changed", OptanonActiveGroups);
            const updatedConsent = {
              targeting: isCategoryActive(consentGroups.targeting),
              // performance: isCategoryActive(consentGroups.performance),
              functional: isCategoryActive(consentGroups.functional),
              social_media: isCategoryActive(consentGroups.social_media),
              analytics: isCategoryActive(consentGroups.analytics),
              necessary: isCategoryActive(consentGroups.necessary)
            };
            console.log("Updating consent", updatedConsent);
            try {
              rudderanalytics.consent({
                consent: updatedConsent
              });
            } catch (error) {
              console.error("OneTrust consent changed: Error updating consent", error);
            }
          });
        }
      }
    </script>

  <body class="bg-gradient-to-b from-blue-200 to-white min-h-screen relative">
    <header class="text-center py-10">
      <h1 class="text-5xl font-bold text-blue-900">OpenAI Supply Shop</h1>
      <p class="text-lg mt-2">For OpenAI Employees Only</p>
      <button id="cart-btn" class="mt-4 bg-blue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800">
        🛒 View Cart
      </button>
    </header>

    <div id="auth-section" class="absolute top-4 right-4">
      <button onclick="toggleSignIn()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
        🔐 Sign In
      </button>
    </div>

    <div id="signin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
      <div class="bg-white rounded-lg p-6 w-80">
        <h2 class="text-xl font-bold mb-4">Sign In</h2>
        <input id="email" type="email" placeholder="Email" class="w-full px-3 py-2 border rounded mb-4" />
        <input id="password" type="password" placeholder="Password" class="w-full px-3 py-2 border rounded mb-4" />
        <button onclick="signIn()" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800 w-full">
          Sign In
        </button>
        <button onclick="toggleSignIn()" class="mt-2 text-sm text-red-600 underline w-full">
          Cancel
        </button>
      </div>
    </div>

    <main class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 px-8 pb-12" id="product-list"></main>

    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex justify-center items-center z-50">
      <div class="relative">
        <button onclick="closeImageModal()" class="absolute top-2 right-2 text-black text-xl font-bold">
          ×
        </button>
        <img id="modal-img" src="" class="max-h-[80vh] max-w-[90vw] rounded-lg shadow-lg" />
      </div>
    </div>

    <div class="hidden opacity-100"></div>

    <div id="toast" class="fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg opacity-0 transition-opacity duration-300 z-50"></div>

    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
      <div class="bg-white rounded-lg p-6 w-80">
        <input id="first-name" type="text" placeholder="First Name" class="mt-2 w-full px-2 py-1 text-sm border rounded" />
        <input id="last-name" type="text" placeholder="Last Name" class="mt-2 w-full px-2 py-1 text-sm border rounded" />
        <textarea id="delivery-address" placeholder="Delivery Address" class="mt-2 w-full px-2 py-1 text-sm border rounded"></textarea>
        <ul id="cart-items" class="mt-4 space-y-2"></ul>
        <p id="total" class="mt-4 font-semibold text-sm">Total: $0.00</p>
        <div class="pb-24">
          <button class="mt-4 bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800" onclick="checkout()">
            Checkout
          </button>
          <button class="mt-2 text-sm text-red-600 underline" onclick="toggleCart()">
            Close
          </button>
        </div>
      </div>
    </div>
