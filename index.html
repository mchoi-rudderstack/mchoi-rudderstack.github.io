<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disney Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- OneTrust Cookie Consent Notice start -->
  <script type="text/javascript" src="https://cdn.cookielaw.org/consent/7c9b4dc8-bb26-4b56-b89b-e5fac96e61a6/OtAutoBlock.js"></script>
  <script src="https://cdn.cookielaw.org/scripttemplates/otSDKStub.js" type="text/javascript" charset="UTF-8" data-domain-script="7c9b4dc8-bb26-4b56-b89b-e5fac96e61a6"></script>
  <script>
    function loadRudder() {
      console.log("Loading RudderStack...");
      var rudderScript = document.createElement("script");
      rudderScript.src = "https://cdn.rudderlabs.com/v3/modern/rsa.min.js";
      rudderScript.async = true;
      rudderScript.setAttribute("data-loader", "RS_JS_SDK");
      rudderScript.setAttribute("data-rsa-write-key", "2fvYsCyRThc3eqsm1wbjWQffU3m");
      rudderScript.onload = function() {
        window.rudderanalytics = window.rudderanalytics || [];
        rudderanalytics.load("2fvYsCyRThc3eqsm1wbjWQffU3m", "https://workspacevempc.dataplane.rudderstack.com");
      };
      document.head.appendChild(rudderScript);
    }

    function OptanonWrapper() {
      console.log("OneTrust OptanonWrapper triggered");
      if (typeof OptanonActiveGroups !== "undefined") {
        console.log("Active Groups:", OptanonActiveGroups);
        const consentCategories = ["C0001", "C0002", "C0003", "C0004", "C0005", "C0007"];
        const hasConsent = consentCategories.some(cat => OptanonActiveGroups.indexOf(cat) > -1);
        if (hasConsent) {
          loadRudder();
        }
      }
    }
  </script>
  <!-- OneTrust Cookie Consent Notice end -->

  <script src="app.js" defer></script>
</head>
<body class="bg-gradient-to-b from-blue-200 to-white min-h-screen relative">

  <header class="text-center py-10">
    <h1 class="text-5xl font-bold text-blue-900">Disney Shop</h1>
    <p class="text-lg mt-2">Magical merch for every fan</p>
    <button id="cart-btn" class="mt-4 bg-blue-700 text-white px-4 py-2 rounded-lg hover:bg-blue-800">🛒 View Cart</button>
  </header>

  <div id="auth-section" class="absolute top-4 right-4">
    <button onclick="toggleSignIn()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">🔐 Sign In</button>
  </div>

  <div id="signin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
    <div class="bg-white rounded-lg p-6 w-80">
      <h2 class="text-xl font-bold mb-4">Sign In</h2>
      <input id="email" type="email" placeholder="Email" class="w-full px-3 py-2 border rounded mb-4" />
      <input id="password" type="password" placeholder="Password" class="w-full px-3 py-2 border rounded mb-4" />
      <button onclick="signIn()" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800 w-full">Sign In</button>
      <button onclick="toggleSignIn()" class="mt-2 text-sm text-red-600 underline w-full">Cancel</button>
    </div>
  </div>

  <main class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 px-8 pb-12" id="product-list"></main>

  <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
    <div class="bg-white rounded-lg p-6 w-96">
      <h2 class="text-xl font-bold mb-4">Your Cart</h2>
      <ul id="cart-items" class="space-y-2"></ul>
      <p id="total" class="mt-4 font-semibold">Total: $0.00</p>
      <button class="mt-4 bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800" onclick="checkout()">Checkout</button>
      <button class="mt-2 text-sm text-red-600 underline" onclick="toggleCart()">Close</button>
    </div>
  </div>

  <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden flex justify-center items-center z-50">
    <div class="relative">
      <button onclick="closeImageModal()" class="absolute top-2 right-2 text-white text-xl font-bold">&times;</button>
      <img id="modal-img" src="" class="max-h-[80vh] max-w-[90vw] rounded-lg shadow-lg" />
    </div>
  </div>

  <!-- Force Tailwind to keep this class -->
  <div class="hidden opacity-100"></div>

  <div id="toast" class="fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg opacity-0 transition-opacity duration-300 z-50"></div>

</body>
</html>
